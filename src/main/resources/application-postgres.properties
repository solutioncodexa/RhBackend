# Optional PostgreSQL profile: --spring.profiles.active=postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rhflow}
spring.datasource.username=${DB_USER:rhflow}
spring.datasource.password=${DB_PASSWORD:rhflow}
spring.datasource.driverClassName=org.postgresql.Driver
spring.h2.console.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
