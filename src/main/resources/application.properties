spring.application.name=rhflow
spring.profiles.default=dev

server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Schéma dédié : même base Neon que Mizane, sans toucher aux tables public du cabinet.
spring.jpa.properties.hibernate.default_schema=rhflow
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.jackson.time-zone=Africa/Casablanca
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.from=${MAIL_FROM:rhflow@localhost}
app.mail.enabled=${MAIL_ENABLED:true}
app.whatsapp.enabled=${WHATSAPP_ENABLED:true}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.graph-version=${WHATSAPP_GRAPH_VERSION:v21.0}

# Local demo only — override with JWT_SECRET in real deployments
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.remember-me-refresh-expiration-ms=${JWT_REMEMBER_REFRESH_MS:2592000000}
app.jwt.max-refresh-tokens-per-user=5
app.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app.minio.enabled=${MINIO_ENABLED:true}
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access=${MINIO_ACCESS:rhflow}
app.minio.secret=${MINIO_SECRET:rhflowsecret}
app.minio.bucket=${MINIO_BUCKET:rhflow}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.default-schema=rhflow
spring.flyway.schemas=rhflow
app.jwt.header=Authorization
app.jwt.prefix=Bearer

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

app.assistant.enabled=true
app.assistant.ollama.base-url=${APP_ASSISTANT_OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.assistant.ollama.model=${APP_ASSISTANT_OLLAMA_MODEL:llama3.2:latest}
app.assistant.ollama.timeout-seconds=20

logging.level.root=INFO
logging.level.ma.rhflow=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{tenantId}] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info
